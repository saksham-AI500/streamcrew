<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamCrew Overlay</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 100%; min-height: 100vh; overflow-x: hidden; background: #090d18; color: #f2f5ff; }
    header { height: 104px; padding: 22px 34px; display: flex; align-items: center; justify-content: space-between; background: #11182a; border-bottom: 1px solid #2a3550; }
    h1 { margin: 0; font-size: 34px; letter-spacing: .02em; }
    header p { margin: 6px 0 0; color: #aebbd7; font-size: 16px; }
    #connection { color: #9ce7bd; font-size: 15px; }
    main { display: grid; grid-template-columns: 1.2fr 1fr; grid-template-rows: minmax(0, 1fr) 230px; gap: 18px; padding: 20px; height: calc(100vh - 104px); }
    section { min-height: 0; overflow: hidden; padding: 18px 20px; border: 1px solid #2a3550; border-radius: 14px; background: #11182a; }
    section h2 { margin: 0 0 14px; color: #c8d6f5; font-size: 19px; text-transform: uppercase; letter-spacing: .08em; }
    #events { grid-row: 1 / 3; }
    .row { padding: 12px 0; border-top: 1px solid #25304a; }
    .row:first-child { border-top: 0; }
    .title { display: flex; justify-content: space-between; gap: 12px; font-size: 18px; font-weight: 650; }
    time, .muted { color: #9eabc5; font-size: 14px; }
    pre { margin: 7px 0 0; color: #c4cee3; font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { padding: 18px 0; color: #9eabc5; font-size: 16px; }
    .approval { color: #ffcf78; }
    .marker { color: #a6f0ce; }
    @media (max-width: 800px) {
      header { height: auto; min-height: 92px; padding: 18px; }
      h1 { font-size: 26px; }
      main { height: auto; min-height: calc(100vh - 92px); grid-template-columns: 1fr; grid-template-rows: auto; padding: 12px; }
      #events { grid-row: auto; }
      section { min-height: 220px; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1>StreamCrew</h1><p>Your stage crew, keeping an eye on the stream.</p></div>
    <div id="connection" role="status">Connecting to local crew…</div>
  </header>
  <main>
    <section id="events"><h2>Recent events</h2><div id="event-list" aria-live="polite"></div></section>
    <section id="markers"><h2>Markers created</h2><div id="marker-list" aria-live="polite"></div></section>
    <section id="approvals"><h2>Pending approvals</h2><div id="approval-list" aria-live="polite"></div></section>
  </main>
  <script>
    "use strict";
    const connection = document.getElementById("connection");

    function addEmpty(target, message) {
      const item = document.createElement("div");
      item.className = "empty";
      item.textContent = message;
      target.replaceChildren(item);
    }

    function renderEvents(events) {
      const target = document.getElementById("event-list");
      if (!events.length) return addEmpty(target, "No events recorded yet.");
      target.replaceChildren(...events.slice(0, 10).map((event) => {
        const row = document.createElement("article");
        row.className = "row";
        const title = document.createElement("div");
        title.className = "title";
        const type = document.createElement("span");
        type.textContent = event.subscription_type || event.message_type;
        const when = document.createElement("time");
        when.textContent = new Date(event.received_at).toLocaleTimeString();
        title.append(type, when);
        const detail = document.createElement("pre");
        detail.textContent = JSON.stringify(event.payload, null, 2);
        row.append(title, detail);
        return row;
      }));
    }

    function renderMarkers(events) {
      const target = document.getElementById("marker-list");
      const markers = events.filter((event) => event.subscription_type === "marker.created");
      if (!markers.length) return addEmpty(target, "No markers recorded yet.");
      target.replaceChildren(...markers.slice(0, 10).map((event) => {
        const row = document.createElement("article");
        row.className = "row marker";
        const marker = event.payload.marker || {};
        const title = document.createElement("div");
        title.className = "title";
        const description = document.createElement("span");
        description.textContent = event.payload.description || marker.description || "Stream marker";
        const when = document.createElement("time");
        when.textContent = new Date(event.received_at).toLocaleTimeString();
        title.append(description, when);
        const detail = document.createElement("div");
        detail.className = "muted";
        detail.textContent = marker.position_seconds == null ? "Marker saved" : `${marker.position_seconds}s into stream`;
        row.append(title, detail);
        return row;
      }));
    }

    function renderApprovals(approvals) {
      const target = document.getElementById("approval-list");
      if (!approvals.length) return addEmpty(target, "Nothing waiting for approval.");
      target.replaceChildren(...approvals.slice(0, 10).map((approval) => {
        const row = document.createElement("article");
        row.className = "row approval";
        const title = document.createElement("div");
        title.className = "title";
        const rule = document.createElement("span");
        rule.textContent = approval.rule_id;
        const id = document.createElement("span");
        id.textContent = `#${approval.id}`;
        title.append(rule, id);
        const detail = document.createElement("pre");
        detail.textContent = approval.action_json;
        row.append(title, detail);
        return row;
      }));
    }

    async function refresh() {
      try {
        const [eventsResponse, approvalsResponse] = await Promise.all([
          fetch("/events?limit=50", { cache: "no-store" }),
          fetch("/approvals?status=pending", { cache: "no-store" })
        ]);
        if (!eventsResponse.ok || !approvalsResponse.ok) throw new Error("local API request failed");
        const [events, approvals] = await Promise.all([
          eventsResponse.json(), approvalsResponse.json()
        ]);
        renderEvents(events.events || []);
        renderMarkers(events.events || []);
        renderApprovals(approvals.approvals || []);
        connection.textContent = "Connected to local crew";
        connection.style.color = "#9ce7bd";
      } catch (_error) {
        connection.textContent = "Local crew unavailable";
        connection.style.color = "#ff9b9b";
      }
    }

    refresh();
    window.setInterval(refresh, 2000);
  </script>
</body>
</html>
