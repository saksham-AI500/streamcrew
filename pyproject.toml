[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamcrew"
version = "0.1.0"
description = "A lightweight AI stage crew for Twitch streamers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "websockets>=12,<17",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
crew = "streamcrew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamcrew = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
